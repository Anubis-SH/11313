  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeIn 1s forwards;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .btn-hover:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease;
      background-color: #ca8a04;
    }
    .sidebar {
      transition: transform 0.3s ease;
    }
    .sidebar-open {
      transform: translateX(0);
    }
    .sidebar-closed {
      transform: translateX(100%);
    }
    section {
      background: linear-gradient(to bottom, #f9fafb, #e5e7eb);
      border-radius: 15px;
      margin: 2rem 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .no-margin-left {
      margin: 0px 20px 0px 20px !important;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .calendar-day {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      min-width: 0;
    }
    .calendar-day:hover {
      background-color: #fef3c7;
    }
    .calendar-day.selected {
      background-color: #facc15;
      color: #fff;
    }
    .calendar-day.disabled {
      background-color: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .calendar-day.in-range {
      background-color: #fef3c7;
      color: #1f2937;
    }
    .availability-message {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
    }
    .available {
      background-color: #d1fae5;
      color: #065f46;
    }
    .unavailable {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .select-wrapper {
      position: relative;
      width: 100%;
    }
    .select-wrapper select {
      width: 100%;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      appearance: none;
      background-color: #fff;
    }
    .select-wrapper::after {
      content: '▼';
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #6b7280;
      pointer-events: none;
    }
    .custom-dropdown {
      position: relative;
      width: 100%;
    }
    .custom-dropdown-toggle {
      width: 100%;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .custom-dropdown-toggle::after {
      content: '▼';
      color: #6b7280;
    }
    .custom-dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background-color: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      z-index: 10;
      margin-top: 2px;
    }
    .custom-dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .custom-dropdown-item:hover {
      background-color: #f3f4f6;
    }
    .flag-img {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 50%;
    }
    @media (max-width: 768px) {
      .calendar-grid {
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
      }
      .calendar-day {
        padding: 8px;
        font-size: 0.9rem;
        min-width: 35px;
        min-height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .calendar-grid > div {
        min-width: 35px;
        font-size: 0.8rem;
      }
      .select-wrapper select,
      .custom-dropdown-toggle {
        padding: 12px;
        font-size: 0.9rem;
      }
      .custom-dropdown-item {
        padding: 8px 12px;
      }
    }
  </style>
</head>

        const BookingForm = () => {
          const [formData, setFormData] = useState({
            checkIn: '',
            checkOut: '',
            guests: 1,
            suite: 'جناح عادي',
            fullName: '',
            email: '',
            phone: '',
            nationality: '',
            nationalId: ''
          });
          const [currentMonth, setCurrentMonth] = useState(new Date());
          const [selectedCheckIn, setSelectedCheckIn] = useState(null);
          const [selectedCheckOut, setSelectedCheckOut] = useState(null);
          const [availability, setAvailability] = useState(null);

          const [isDropdownOpen, setIsDropdownOpen] = useState(false);

          const suites = ['جناح عادي', 'جناح ديلوكس', 'جناح ملكي'];

          const formatDateToLocalString = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          };

          const handleChange = (e) => {
            const { name, value } = e.target;
            const newDate = value ? new Date(value) : null;

            if (name === 'checkIn') {
              setSelectedCheckIn(newDate);
              if (newDate && selectedCheckOut && newDate > selectedCheckOut) {
                setSelectedCheckOut(null);
                setFormData({ ...formData, checkIn: value, checkOut: '' });
              } else {
                setFormData({ ...formData, checkIn: value });
              }
            } else if (name === 'checkOut') {
              setSelectedCheckOut(newDate);
              setFormData({ ...formData, checkOut: value });
            } else {
              setFormData({ ...formData, [name]: value });
            }

            if (newDate && name === 'checkIn') {
              setCurrentMonth(new Date(newDate.getFullYear(), newDate.getMonth(), 1));
            }
          };

          const handleNationalitySelect = (nationality) => {
            setFormData({ ...formData, nationality });
            setIsDropdownOpen(false);
          };

          const handleDateSelect = (date, type) => {
            const formattedDate = formatDateToLocalString(date);

            if (type === 'checkIn') {
              setSelectedCheckIn(date);
              setFormData({ ...formData, checkIn: formattedDate });
              if (selectedCheckOut && date > selectedCheckOut) {
                setSelectedCheckOut(null);
                setFormData({ ...formData, checkIn: formattedDate, checkOut: '' });
              }
            } else {
              setSelectedCheckOut(date);
              setFormData({ ...formData, checkOut: formattedDate });
            }
          };

          const checkAvailability = async () => {
            try {
              const checkInDate = new Date(formData.checkIn);
              const checkOutDate = new Date(formData.checkOut);

              const bookingsRef = db.collection('bookings');
              const snapshot = await bookingsRef
                .where('suite', '==', formData.suite)
                .get();

              let isAvailable = true;

              snapshot.forEach(doc => {
                const booking = doc.data();
                const existingCheckIn = new Date(booking.checkIn);
                const existingCheckOut = new Date(booking.checkOut);

                if (
                  (checkInDate >= existingCheckIn && checkInDate < existingCheckOut) ||
                  (checkOutDate > existingCheckIn && checkOutDate <= existingCheckOut) ||
                  (checkInDate <= existingCheckIn && checkOutDate >= existingCheckOut)
                ) {
                  isAvailable = false;
                }
              });

              setAvailability(isAvailable);
            } catch (error) {
              console.error('خطأ أثناء التحقق من التوفر:', error);
              setAvailability(false);
            }
          };

          const saveBooking = async () => {
            try {
              await db.collection('bookings').add({
                suite: formData.suite,
                checkIn: formData.checkIn,
                checkOut: formData.checkOut,
                guests: parseInt(formData.guests),
                fullName: formData.fullName,
                email: formData.email,
                phone: formData.phone,
                nationality: formData.nationality,
                nationalId: formData.nationalId,
                createdAt: new Date().toISOString(),
                read: false
              });
              setBookingStatus('تم الحجز بنجاح!');
              setFormData({
                checkIn: '',
                checkOut: '',
                guests: 1,
                suite: 'جناح عادي',
                fullName: '',
                email: '',
                phone: '',
                nationality: '',
                nationalId: ''
              });
              setSelectedCheckIn(null);
              setSelectedCheckOut(null);
              setAvailability(null);
            } catch (error) {
              console.error('خطأ أثناء الحجز:', error);
              setBookingStatus('حدث خطأ أثناء الحجز، حاول مرة أخرى.');
            }
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (formData.checkIn && formData.checkOut && formData.guests && formData.suite) {
              await checkAvailability();
            }
          };

          const handleConfirmBooking = () => {
            if (availability) {
              saveBooking();
            }
          };

          const generateCalendar = () => {
            const startOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const endOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
            const startDay = startOfMonth.getDay();
            const daysInMonth = endOfMonth.getDate();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const days = [];
            for (let i = 0; i < startDay; i++) {
              days.push(<div key={`empty-${i}`} className="calendar-day"></div>);
            }

            for (let day = 1; day <= daysInMonth; day++) {
              const currentDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
              const isDisabled = currentDate < today;

              const currentDateString = formatDateToLocalString(currentDate);
              const selectedCheckInString = selectedCheckIn ? formatDateToLocalString(selectedCheckIn) : null;
              const selectedCheckOutString = selectedCheckOut ? formatDateToLocalString(selectedCheckOut) : null;

              const isSelectedCheckIn = selectedCheckInString && currentDateString === selectedCheckInString;
              const isSelectedCheckOut = selectedCheckOutString && currentDateString === selectedCheckOutString;
              const isInRange =
                selectedCheckIn &&
                selectedCheckOut &&
                currentDate > selectedCheckIn &&
                currentDate < selectedCheckOut;

              days.push(
                <div
                  key={day}
                  className={`calendar-day ${isDisabled ? 'disabled' : ''} ${isSelectedCheckIn || isSelectedCheckOut ? 'selected' : ''} ${isInRange ? 'in-range' : ''}`}
                  onClick={() => {
                    if (!isDisabled) {
                      if (!selectedCheckIn || (selectedCheckIn && selectedCheckOut)) {
                        setSelectedCheckIn(currentDate);
                        setSelectedCheckOut(null);
                        handleDateSelect(currentDate, 'checkIn');
                      } else if (selectedCheckIn && !selectedCheckOut && currentDate > selectedCheckIn) {
                        handleDateSelect(currentDate, 'checkOut');
                      }
                    }
                  }}
                >
                  {day}
                </div>
              );
            }

            return days;
          };

          const changeMonth = (direction) => {
            setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + direction, 1));
          };

          return (
            <section className="py-16">
              <div className="container mx-auto px-4">
                <h2 className="text-4xl font-bold text-center mb-8 fade-in text-gray-800">احجز غرفتك الآن</h2>
                <div className="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-lg fade-in">
                  <div className="mb-8">
                    <h3 className="text-2xl font-semibold mb-4 text-yellow-600">اختر التواريخ</h3>
                    <div className="flex justify-between items-center mb-4">
                      <button onClick={() => changeMonth(-1)} className="text-gray-600 hover:text-yellow-500">
                        <i className="fas fa-chevron-right"></i>
                      </button>
                      <h4 className="text-lg font-semibold text-gray-800">
                        {currentMonth.toLocaleString('ar-EG', { month: 'long', year: 'numeric' })}
                      </h4>
                      <button onClick={() => changeMonth(1)} className="text-gray-600 hover:text-yellow-500">
                        <i className="fas fa-chevron-left"></i>
                      </button>
                    </div>
                    <div className="calendar-grid">
                      {['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'].map((day, index) => (
                        <div key={index} className="text-gray-600 font-semibold">{day}</div>
                      ))}
                      {generateCalendar()}
                    </div>
                  </div>
                  <div className="grid md:grid-cols-2 gap-6 mb-6">
                    <div>
                      <label className="block text-gray-700 mb-2">تاريخ الوصول</label>
                      <input
                        type="date"
                        name="checkIn"
                        value={formData.checkIn}
                        onChange={handleChange}
                        className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        min={new Date().toISOString().split('T')[0]}
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-gray-700 mb-2">تاريخ المغادرة</label>
                      <input
                        type="date"
                        name="checkOut"
                        value={formData.checkOut}
                        onChange={handleChange}
                        className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        min={formData.checkIn || new Date().toISOString().split('T')[0]}
                        required
                      />
                    </div>
                  </div>
                  <div className="grid md:grid-cols-2 gap-6 mb-6">
                    <div>
                      <label className="block text-gray-700 mb-2">عدد الأفراد</label>
                      <input
                        type="number"
                        name="guests"
                        value={formData.guests}
                        onChange={handleChange}
                        min="1"
                        className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-gray-700 mb-2">نوع الجناح</label>
                      <div className="select-wrapper">
                        <select
                          name="suite"
                          value={formData.suite}
                          onChange={handleChange}
                          className="w-full"
                          required
                        >
                          {suites.map((suite, index) => (
                            <option key={index} value={suite}>{suite}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>
                  <div className="grid md:grid-cols-2 gap-6 mb-6">
                    <div>
                      <label className="block text-gray-700 mb-2">الاسم الكامل</label>
                      <input
                        type="text"
                        name="fullName"
                        value={formData.fullName}
                        onChange={handleChange}
                        className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-gray-700 mb-2">البريد الإلكتروني</label>
                      <input
                        type="email"
                        name="email"
                        value={formData.email}
                        onChange={handleChange}
                        className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        required
                      />
                    </div>
                  </div>
                  <div className="grid md:grid-cols-2 gap-6 mb-6">
                    <div>
                      <label className="block text-gray-700 mb-2">رقم الهاتف</label>
                      <input
                        type="tel"
                        name="phone"
                        value={formData.phone}
                        onChange={handleChange}
                        className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-gray-700 mb-2">الجنسية</label>
                      <div className="custom-dropdown">
                        <div
                          className="custom-dropdown-toggle"
                          onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                        >
                          {formData.nationality || 'اختر الجنسية'}
                        </div>
                        {isDropdownOpen && (
                          <div className="custom-dropdown-menu">
                            {countries.map(country => (
                              <div
                                key={country.code}
                                className="custom-dropdown-item"
                                onClick={() => handleNationalitySelect(country.name)}
                              >
                                <img
                                  src={`https://flagcdn.com/24x18/${country.code.toLowerCase()}.png`}
                                  alt={`${country.name} flag`}
                                  className="flag-img"
                                />
                                {country.name}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                  <div className="mb-6">
                    <label className="block text-gray-700 mb-2">الرقم القومي</label>
                    <input
                      type="text"
                      name="nationalId"
                      value={formData.nationalId}
                      onChange={handleChange}
                      className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      required
                    />
                  </div>
                  <button
                    onClick={handleSubmit}
                    className="bg-yellow-500 text-white px-8 py-4 rounded-full btn-hover w-full font-semibold mb-4"
                  >
                    تحقق من التوفر
                  </button>
                  {availability !== null && (
                    <div className={`availability-message ${availability ? 'available' : 'unavailable'} mb-4`}>
                      {availability ? 'الجناح متاح للحجز!' : 'عذرًا، الجناح محجوز في هذه التواريخ.'}
                    </div>
                  )}
                  {availability === true && (
                    <button
                      onClick={handleConfirmBooking}
                      className="bg-green-500 text-white px-8 py-4 rounded-full btn-hover w-full font-semibold"
                    >
                      تأكيد الحجز
                    </button>
                  )}
                  {bookingStatus && (
                    <div className={`availability-message ${bookingStatus.includes('نجاح') ? 'available' : 'unavailable'} mt-4`}>
                      {bookingStatus}
                    </div>
                  )}
                </div>
              </div>
            </section>
          );
        };

        const App = () => (
          <div>
            <Navbar />
            <BookingForm />
            <div className="py-8 bg-gray-800 text-white text-center">
              <p>© 2025 فندق الأحلام. جميع الحقوق محفوظة.</p>
            </div>
          </div>
        );

        // عرض التطبيق بعد التأكد من تحميل Firebase
        ReactDOM.render(<App />, document.getElementById("root"));
      } else {
        // إذا لم يتم تحميل Firebase بعد، انتظر قليلاً ثم حاول مرة أخرى
        setTimeout(initializeAppWhenFirebaseLoaded, 100);
      }
    }

    // ابدأ عملية التهيئة
    initializeAppWhenFirebaseLoaded();
  </script>
</body>
</html>
