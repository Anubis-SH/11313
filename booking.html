<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز غرفة - فندق الأحلام</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeIn 1s forwards;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .btn-hover:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease;
      background-color: #ca8a04;
    }
    .sidebar {
      transition: transform 0.3s ease;
    }
    .sidebar-open {
      transform: translateX(0);
    }
    .sidebar-closed {
      transform: translateX(100%);
    }
    section {
      background: linear-gradient(to bottom, #f9fafb, #e5e7eb);
      border-radius: 15px;
      margin: 2rem 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .no-margin-left {
      margin: 0px 20px 0px 20px !important;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .calendar-day {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      min-width: 0; /* لضمان عدم التقليص الزائد */
    }
    .calendar-day:hover {
      background-color: #fef3c7;
    }
    .calendar-day.selected {
      background-color: #facc15;
      color: #fff;
    }
    .calendar-day.disabled {
      background-color: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .calendar-day.in-range {
      background-color: #fef3c7;
      color: #1f2937;
    }
    .availability-message {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
    }
    .available {
      background-color: #d1fae5;
      color: #065f46;
    }
    .unavailable {
      background-color: #fee2e2;
      color: #991b1b;
    }
    /* Responsive styles for calendar on mobile */
    @media (max-width: 768px) {
      .calendar-grid {
        grid-template-columns: repeat(7, 1fr);
        gap: 3px; /* تقليل المسافة بين الأيام على الموبايل */
      }
      .calendar-day {
        padding: 8px; /* تقليل الـ padding على الموبايل */
        font-size: 0.9rem; /* تقليل حجم الخط */
        min-width: 35px; /* ضمان حجم مناسب لكل يوم */
        min-height: 35px; /* ضمان ارتفاع مناسب */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .calendar-grid > div {
        min-width: 35px; /* ضمان حجم مناسب لأيام الأسبوع */
        font-size: 0.8rem; /* تقليل حجم أيام الأسبوع */
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // تهيئة Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB8251F2kC0lW9oItJY2NAg3kMNN9LYRc",
      authDomain: "dreamhotel-f6a1c.firebaseapp.com",
      projectId: "dreamhotel-f6a1c",
      storageBucket: "dreamhotel-f6a1c.appspot.com",
      messagingSenderId: "781143287086",
      appId: "1:781143287086:web:8fc657f25c3ba1531db",
      measurementId: "G-Z2DBV3KY16"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const Navbar = () => {
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);

      return (
        <nav className="fixed top-0 w-full bg-white shadow-lg z-20">
          <div className="container mx-auto px-6 py-5 flex justify-between items-center">
            <h1 className="text-3xl font-bold text-yellow-600 mr-8">فندق الأحلام</h1>
            <button
              className="md:hidden text-2xl"
              onClick={() => setIsSidebarOpen(!isSidebarOpen)}
            >
              ☰
            </button>
            <div className="hidden md:flex items-center space-x-0 text-base">
              <a href="index.html" className="text-gray-700 hover:text-yellow-500 transition px-4 ">الرئيسية</a>
              <a href="booking.html" className="text-gray-700 hover:text-yellow-500 transition px-4">الحجز</a>
              <a href="menu.html" className="text-gray-700 hover:text-yellow-500 transition px-4">قائمة الطعام</a>
              <a href="#contact" className="text-gray-700 hover:text-yellow-500 transition px-4">تواصل معنا</a>
              <div className="flex items-center space-x-5">
               <div className="no-margin-left">
                <a href="https://facebook.com" target="_blank" className="text-gray-700 hover:text-yellow-500 text-sm">
                  <i className="fab fa-facebook-f"></i>
                </a>
                </div>
                <a href="https://instagram.com" target="_blank" className="text-gray-700 hover:text-yellow-500 text-sm">
                  <i className="fab fa-instagram"></i>
                </a>
                <a href="tel:+201152030355" className="text-gray-700 hover:text-yellow-500">
                  <i className="fas fa-phone-alt text-xl"></i>
                </a>
              </div>
            </div>
          </div>
          <div
            className={`md:hidden fixed top-0 right-0 h-full w-64 bg-white shadow-lg sidebar ${
              isSidebarOpen ? 'sidebar-open' : 'sidebar-closed'
            }`}
          >
            <div className="p-6">
              <button
                className="text-2xl mb-6"
                onClick={() => setIsSidebarOpen(false)}
              >
                ✕
              </button>
              <div className="flex flex-col space-y-6 text-base">
                <a href="index.html" className="text-gray-700 hover:text-yellow-500 transition">الرئيسية</a>
                <a href="booking.html" className="text-gray-700 hover:text-yellow-500 transition">الحجز</a>
                <a href="menu.html" className="text-gray-700 hover:text-yellow-500 transition">قائمة الطعام</a>
                <a href="#contact" className="text-gray-700 hover:text-yellow-500 transition">تواصل معنا</a>
                <div className="flex space-x-4 mt-4">
                <div className="no-margin-left">
                  <a href="https://facebook.com" target="_blank" className="text-gray-700 hover:text-yellow-500 text-sm">
                    <i className="fab fa-facebook-f"></i>
                  </a>
                  </div>
                  <div className="no-margin-left">
                  <a href="https://instagram.com" target="_blank" className="text-gray-700 hover:text-yellow-500 text-sm">
                    <i className="fab fa-instagram"></i>
                  </a>
                  </div>
                  <div className="no-margin-left">
                  <a href="tel:+201152030355" className="text-gray-700 hover:text-yellow-500">
                    <i className="fas fa-phone-alt text-xl"></i>
                  </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </nav>
      );
    };

    const BookingForm = () => {
      const [formData, setFormData] = useState({
        checkIn: '',
        checkOut: '',
        guests: 1,
        suite: 'جناح عادي'
      });
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedCheckIn, setSelectedCheckIn] = useState(null);
      const [selectedCheckOut, setSelectedCheckOut] = useState(null);
      const [availability, setAvailability] = useState(null);
      const [bookingStatus, setBookingStatus] = useState('');

      const suites = ['جناح عادي', 'جناح ديلوكس', 'جناح ملكي'];

      const handleChange = (e) => {
        const { name, value } = e.target;
        const newDate = value ? new Date(value) : null;

        if (name === 'checkIn') {
          setSelectedCheckIn(newDate);
          if (newDate && selectedCheckOut && newDate > selectedCheckOut) {
            setSelectedCheckOut(null);
            setFormData({ ...formData, checkIn: value, checkOut: '' });
          } else {
            setFormData({ ...formData, checkIn: value });
          }
        } else if (name === 'checkOut') {
          setSelectedCheckOut(newDate);
          setFormData({ ...formData, checkOut: value });
        } else {
          setFormData({ ...formData, [name]: value });
        }

        if (newDate && name === 'checkIn') {
          setCurrentMonth(new Date(newDate.getFullYear(), newDate.getMonth(), 1));
        }
      };

      const handleDateSelect = (date, type) => {
        if (type === 'checkIn') {
          setSelectedCheckIn(date);
          setFormData({ ...formData, checkIn: date.toISOString().split('T')[0] });
          if (selectedCheckOut && date > selectedCheckOut) {
            setSelectedCheckOut(null);
            setFormData({ ...formData, checkIn: date.toISOString().split('T')[0], checkOut: '' });
          }
        } else {
          setSelectedCheckOut(date);
          setFormData({ ...formData, checkOut: date.toISOString().split('T')[0] });
        }
      };

      const checkAvailability = async () => {
        try {
          const checkInDate = new Date(formData.checkIn);
          const checkOutDate = new Date(formData.checkOut);

          const bookingsRef = db.collection('bookings');
          const snapshot = await bookingsRef
            .where('suite', '==', formData.suite)
            .get();

          let isAvailable = true;

          snapshot.forEach(doc => {
            const booking = doc.data();
            const existingCheckIn = new Date(booking.checkIn);
            const existingCheckOut = new Date(booking.checkOut);

            if (
              (checkInDate >= existingCheckIn && checkInDate < existingCheckOut) ||
              (checkOutDate > existingCheckIn && checkOutDate <= existingCheckOut) ||
              (checkInDate <= existingCheckIn && checkOutDate >= existingCheckOut)
            ) {
              isAvailable = false;
            }
          });

          setAvailability(isAvailable);
        } catch (error) {
          console.error('خطأ أثناء التحقق من التوفر:', error);
          setAvailability(false);
        }
      };

      const saveBooking = async () => {
        try {
          await db.collection('bookings').add({
            suite: formData.suite,
            checkIn: formData.checkIn,
            checkOut: formData.checkOut,
            guests: parseInt(formData.guests),
            createdAt: new Date().toISOString()
          });
          setBookingStatus('تم الحجز بنجاح!');
          setFormData({ checkIn: '', checkOut: '', guests: 1, suite: 'جناح عادي' });
          setSelectedCheckIn(null);
          setSelectedCheckOut(null);
          setAvailability(null);
        } catch (error) {
          console.error('خطأ أثناء الحجز:', error);
          setBookingStatus('حدث خطأ أثناء الحجز، حاول مرة أخرى.');
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (formData.checkIn && formData.checkOut && formData.guests && formData.suite) {
          await checkAvailability();
        }
      };

      const handleConfirmBooking = () => {
        if (availability) {
          saveBooking();
        }
      };

      const generateCalendar = () => {
        const startOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
        const endOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
        const startDay = startOfMonth.getDay();
        const daysInMonth = endOfMonth.getDate();
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const days = [];
        for (let i = 0; i < startDay; i++) {
          days.push(<div key={`empty-${i}`} className="calendar-day"></div>);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const currentDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
          const isDisabled = currentDate < today;
          const isSelectedCheckIn = selectedCheckIn && currentDate.toDateString() === selectedCheckIn.toDateString();
          const isSelectedCheckOut = selectedCheckOut && currentDate.toDateString() === selectedCheckOut.toDateString();
          const isInRange =
            selectedCheckIn &&
            selectedCheckOut &&
            currentDate > selectedCheckIn &&
            currentDate < selectedCheckOut;

          days.push(
            <div
              key={day}
              className={`calendar-day ${isDisabled ? 'disabled' : ''} ${isSelectedCheckIn || isSelectedCheckOut ? 'selected' : ''} ${isInRange ? 'in-range' : ''}`}
              onClick={() => {
                if (!isDisabled) {
                  if (!selectedCheckIn || (selectedCheckIn && selectedCheckOut)) {
                    setSelectedCheckIn(currentDate);
                    setSelectedCheckOut(null);
                    handleDateSelect(currentDate, 'checkIn');
                  } else if (selectedCheckIn && !selectedCheckOut && currentDate > selectedCheckIn) {
                    handleDateSelect(currentDate, 'checkOut');
                  }
                }
              }}
            >
              {day}
            </div>
          );
        }

        return days;
      };

      const changeMonth = (direction) => {
        setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + direction, 1));
      };

      return (
        <section className="py-16">
          <div className="container mx-auto px-4">
            <h2 className="text-4xl font-bold text-center mb-8 fade-in text-gray-800">احجز غرفتك الآن</h2>
            <div className="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-lg fade-in">
              <div className="mb-8">
                <h3 className="text-2xl font-semibold mb-4 text-yellow-600">اختر التواريخ</h3>
                <div className="flex justify-between items-center mb-4">
                  <button onClick={() => changeMonth(-1)} className="text-gray-600 hover:text-yellow-500">
                    <i className="fas fa-chevron-right"></i>
                  </button>
                  <h4 className="text-lg font-semibold text-gray-800">
                    {currentMonth.toLocaleString('ar-EG', { month: 'long', year: 'numeric' })}
                  </h4>
                  <button onClick={() => changeMonth(1)} className="text-gray-600 hover:text-yellow-500">
                    <i className="fas fa-chevron-left"></i>
                  </button>
                </div>
                <div className="calendar-grid">
                  {['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'].map((day, index) => (
                    <div key={index} className="text-gray-600 font-semibold">{day}</div>
                  ))}
                  {generateCalendar()}
                </div>
              </div>
              <div className="grid md:grid-cols-2 gap-6 mb-6">
                <div>
                  <label className="block text-gray-700 mb-2">تاريخ الوصول</label>
                  <input
                    type="date"
                    name="checkIn"
                    value={formData.checkIn}
                    onChange={handleChange}
                    className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                    min={new Date().toISOString().split('T')[0]}
                    required
                  />
                </div>
                <div>
                  <label className="block text-gray-700 mb-2">تاريخ المغادرة</label>
                  <input
                    type="date"
                    name="checkOut"
                    value={formData.checkOut}
                    onChange={handleChange}
                    className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                    min={formData.checkIn || new Date().toISOString().split('T')[0]}
                    required
                  />
                </div>
              </div>
              <div className="grid md:grid-cols-2 gap-6 mb-6">
                <div>
                  <label className="block text-gray-700 mb-2">عدد الأفراد</label>
                  <input
                    type="number"
                    name="guests"
                    value={formData.guests}
                    onChange={handleChange}
                    min="1"
                    className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                    required
                  />
                </div>
                <div>
                  <label className="block text-gray-700 mb-2">نوع الجناح</label>
                  <select
                    name="suite"
                    value={formData.suite}
                    onChange={handleChange}
                    className="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"
                    required
                  >
                    {suites.map((suite, index) => (
                      <option key={index} value={suite}>{suite}</option>
                    ))}
                  </select>
                </div>
              </div>
              <button
                onClick={handleSubmit}
                className="bg-yellow-500 text-white px-8 py-4 rounded-full btn-hover w-full font-semibold mb-4"
              >
                تحقق من التوفر
              </button>
              {availability !== null && (
                <div className={`availability-message ${availability ? 'available' : 'unavailable'} mb-4`}>
                  {availability ? 'الجناح متاح للحجز!' : 'عذرًا، الجناح محجوز في هذه التواريخ.'}
                </div>
              )}
              {availability === true && (
                <button
                  onClick={handleConfirmBooking}
                  className="bg-green-500 text-white px-8 py-4 rounded-full btn-hover w-full font-semibold"
                >
                  تأكيد الحجز
                </button>
              )}
              {bookingStatus && (
                <div className={`availability-message ${bookingStatus.includes('نجاح') ? 'available' : 'unavailable'} mt-4`}>
                  {bookingStatus}
                </div>
              )}
            </div>
          </div>
        </section>
      );
    };

    const App = () => (
      <div>
        <Navbar />
        <BookingForm />
        <div className="py-8 bg-gray-800 text-white text-center">
          <p>© 2025 فندق الأحلام. جميع الحقوق محفوظة.</p>
        </div>
      </div>
    );

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
